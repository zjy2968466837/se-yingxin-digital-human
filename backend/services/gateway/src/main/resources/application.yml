server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  cloud:
    gateway:
      # Spring Cloud Gateway 4.3+（2025.0.x）配置前缀为 server.webflux
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8100}
              predicates:
                - Path=/api/auth/**
            - id: qa-service
              uri: ${QA_SERVICE_URI:http://localhost:8101}
              predicates:
                - Path=/api/qa/**
            - id: checkin-service
              uri: ${CHECKIN_SERVICE_URI:http://localhost:8102}
              predicates:
                - Path=/api/checkin/**
            - id: navigation-service
              uri: ${NAVIGATION_SERVICE_URI:http://localhost:8103}
              predicates:
                - Path=/api/navigation/**
            - id: aid-service
              uri: ${AID_SERVICE_URI:http://localhost:8104}
              predicates:
                - Path=/api/aid/**
            - id: life-service
              uri: ${LIFE_SERVICE_URI:http://localhost:8105}
              predicates:
                - Path=/api/life/**
            - id: content-service
              uri: ${CONTENT_SERVICE_URI:http://localhost:8106}
              predicates:
                - Path=/api/content/**
            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:8107}
              predicates:
                - Path=/api/admin/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

yingxin:
  jwt:
    secret: ${JWT_SECRET:yingxin-dev-secret-key-must-be-over-32-bytes-ok}
  gateway:
    auth:
      whitelist:
        - /api/*/ping
        - /api/auth/login
        - /api/auth/login/**
        - /api/public/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
