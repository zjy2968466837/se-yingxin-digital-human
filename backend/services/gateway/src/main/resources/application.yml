server:
  port: 8080

spring:
  application:
    name: gateway
  # 会话校验用（登出即失效，F1.8）：本地 Docker Redis 无密码，云端用 REDIS_PASSWORD 注入
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3s
  cloud:
    gateway:
      # Spring Cloud Gateway 4.3+（2025.0.x）配置前缀为 server.webflux
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8100}
              predicates:
                - Path=/api/auth/**
            - id: qa-service
              uri: ${QA_SERVICE_URI:http://localhost:8101}
              predicates:
                - Path=/api/qa/**
            - id: checkin-service
              uri: ${CHECKIN_SERVICE_URI:http://localhost:8102}
              predicates:
                - Path=/api/checkin/**
            - id: navigation-service
              uri: ${NAVIGATION_SERVICE_URI:http://localhost:8103}
              predicates:
                - Path=/api/navigation/**
            - id: aid-service
              uri: ${AID_SERVICE_URI:http://localhost:8104}
              predicates:
                - Path=/api/aid/**
            - id: life-service
              uri: ${LIFE_SERVICE_URI:http://localhost:8105}
              predicates:
                - Path=/api/life/**
            - id: content-service
              uri: ${CONTENT_SERVICE_URI:http://localhost:8106}
              predicates:
                - Path=/api/content/**
            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:8107}
              predicates:
                - Path=/api/admin/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

# 鉴权（开发规范 §4.2）：密钥必须与 auth-service 一致，由 JWT_SECRET 注入
yingxin:
  auth:
    enabled: true
    jwt-secret: ${JWT_SECRET:yingxin-local-dev-jwt-secret-change-me-32bytes}
    # 额外放行：默认空。/actuator/**、/swagger-ui.html 本地调试可临时加，云端必须收敛
    extra-whitelist: []

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
