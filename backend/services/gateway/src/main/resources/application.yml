server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      # Spring Cloud Gateway 4.3+（2025.0.x）配置前缀为 server.webflux
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8100}
              predicates:
                - Path=/api/auth/**
            - id: qa-service
              uri: ${QA_SERVICE_URI:http://localhost:8101}
              predicates:
                - Path=/api/qa/**
            - id: checkin-service
              uri: ${CHECKIN_SERVICE_URI:http://localhost:8102}
              predicates:
                - Path=/api/checkin/**
            - id: navigation-service
              uri: ${NAVIGATION_SERVICE_URI:http://localhost:8103}
              predicates:
                - Path=/api/navigation/**
            - id: aid-service
              uri: ${AID_SERVICE_URI:http://localhost:8104}
              predicates:
                - Path=/api/aid/**
            - id: life-service
              uri: ${LIFE_SERVICE_URI:http://localhost:8105}
              predicates:
                - Path=/api/life/**
            - id: content-service
              uri: ${CONTENT_SERVICE_URI:http://localhost:8106}
              predicates:
                - Path=/api/content/**
            - id: admin-service
              uri: ${ADMIN_SERVICE_URI:http://localhost:8107}
              predicates:
                - Path=/api/admin/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      access: unrestricted
