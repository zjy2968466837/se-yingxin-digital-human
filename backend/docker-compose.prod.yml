# 生产可选：仅容器化 SpringBoot 应用层（方案 B）
# 默认推荐方案 A：systemd + jar。
# 注意：生产 MySQL/Redis 不在此编排，分别使用 Azure MySQL 与 VM 本机 Redis。
#
# 用法（仅当采用方案 B）：
# docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  gateway:
    image: ${GATEWAY_IMAGE}
    container_name: yingxin-gateway
    restart: always
    env_file:
      - .env.prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
    network_mode: host
