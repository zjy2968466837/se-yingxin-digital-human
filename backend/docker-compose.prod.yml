# 生产/云上环境：MySQL + Redis
# 用法：docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# 与本地版的区别：不映射公网端口、数据落盘、密码走 .env.prod（不入库）

services:
  mysql:
    image: mysql:8.0
    container_name: yingxin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: yingxin
      MYSQL_USER: yingxin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 不对外映射端口！后端容器走内部网络访问；如需本机调试用 ssh 隧道
    expose:
      - "3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: yingxin-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
