# 云上部署：只编排后端微服务。
#
# MySQL 与 Redis 不使用容器：
#   - MySQL 用 Azure Database for MySQL（PaaS），连接信息走 .env.prod
#   - Redis 用云服务器上已有的 systemd 服务（127.0.0.1:6379）
# 详见 docs/部署指南.md。
#
# 用法（backend/ 目录下）：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# 注意：本机 3.8G 内存跑满 9 个服务偏紧，演示时可按需只起 gateway + 用到的服务：
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d gateway auth-service

name: yingxin-backend

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    image: yingxin/gateway:${IMAGE_TAG:-latest}
    container_name: yingxin-gateway
    restart: always
    env_file: .env.prod
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: yingxin/auth-service:${IMAGE_TAG:-latest}
    container_name: yingxin-auth-service
    restart: always
    env_file: .env.prod
    expose:
