# 本地开发基础设施：MySQL 8.0 + Redis 7.0 + S3 兼容对象存储
#
# 镜像版本刻意与云端保持一致（2026-09 实测）：
#   - 云端 MySQL：Azure Database for MySQL Flexible Server，SELECT VERSION() = 8.0.46-azure
#   - 云端 Redis：Azure Linux VM 上的 systemd 服务，INFO server = 7.0.15
# 升级版本时请同时核对云端，避免「本地能跑、云上报错」。
#
# 用法：docker compose up -d

services:
  mysql:
    image: mysql:8.0.46
    container_name: yingxin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: yingxin
      MYSQL_USER: yingxin
      MYSQL_PASSWORD: yingxin123
      TZ: Asia/Shanghai
    # lower_case_table_names=1 与云端一致（云端该参数即为 1）。
    # 注意：该参数只在数据卷首次初始化时生效，改完需删掉旧卷重建：
    #   docker compose down -v && docker compose up -d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower-case-table-names=1
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.0.15-alpine
    container_name: yingxin-redis
    restart: unless-stopped
    # 与云端保持一致：开启 AOF 持久化。本地不设密码（云端有 requirepass）
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 本地 S3 兼容对象存储（rclone 保底）。
  # 课程/报告主选 SeaweedFS 4.51：Windows 单文件 weed.exe + Filer UI（8888），
  #   与 rclone 同走 S3 协议，common-file 的 MinioFileStorage 零代码改动，
  #   启动命令见 docs/文件存储与分片上传方案.md §8。
  # 为什么不是 MinIO：MinIO 社区版已于 2025 年归档，官网二进制与镜像不再分发（实测 410 Gone）。
  # 本 compose 保留 rclone serve s3 作为离线保底（单镜像、启动简单）；
  # 云端改用阿里云 OSS 时只改 FILE_PROVIDER=oss，不动业务代码。
  s3:
    image: rclone/rclone:1.75.2
    container_name: yingxin-s3
    restart: unless-stopped
    command:
      - serve
      - s3
      - :local:/data
      - --addr
      - 0.0.0.0:9000
      - --auth-key
      - minioadmin,minioadmin
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/data

volumes:
  mysql-data:
  redis-data:
  s3-data:
